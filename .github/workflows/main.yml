
name: Next.js CI Pipeline

# When should this workflow execute?
on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

# Jobs to execute
jobs:
  build:
    name: Build Next.js Application

    # GitHub provides an Ubuntu virtual machine
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download repository code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Install Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Step 3: Install dependencies
      - name: Install Dependencies
        run: npm ci

      # Step 4: Run ESLint
      - name: Run Lint
        run: npm run lint

      # Step 5: Build Next.js application
      - name: Build Application
        run: npm run build
